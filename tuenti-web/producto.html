<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- MAQUETA para revisión: el sitio todavía NO debe indexarse.
     Quitar esta línea al publicar. Ver docs/TRASPASO_WEB.md §0.3 -->
<meta name="robots" content="noindex, nofollow">
<title>—</title>
<meta name="description" content="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%95%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..800&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Anton&family=Caveat:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="export-boutique/tokens.css">
<link rel="stylesheet" href="export-boutique/componentes.css">
<link rel="stylesheet" href="tienda.css">
<link rel="stylesheet" href="landing.css">

<style>
:root{
  --t-bg:var(--c-bg); --t-panel:var(--c-surface); --t-text:var(--c-ink);
  --t-muted:var(--c-muted); --t-line:var(--c-line);
  /* --t-accent era var(--c-ink) y --t-accent-txt var(--c-on-dark): con la
     paleta invertida los dos son BLANCO y el texto desaparecía. El acento del
     módulo pasa al verde de la identidad. */
  --t-accent:var(--c-accent); --t-accent-txt:var(--c-accent-ink);
  /* --t-wa y --t-wa-txt los usa el botón flotante de WhatsApp en landing.css
     y NO estaban declarados en ninguna parte: el botón salía sin fondo. */
  --t-wa:var(--c-accent); --t-wa-txt:var(--c-accent-ink);
  --t-radius:0; --t-font:var(--font); --t-ease:var(--ease);
}
.volver{display:inline-flex;gap:.4rem;align-items:center;margin-bottom:var(--sp-5);
  font-size:var(--fs-nav);font-weight:var(--w-semibold);text-transform:uppercase;
  letter-spacing:var(--tr-label);color:var(--c-muted)}
.volver:hover{color:var(--c-ink)}
.pdp-cat{margin-bottom:var(--sp-2)}
</style>

<!-- tienda.js NO se carga: su carrito no guarda talla ni referencia, agrupa por
     nombre visible, no tiene vaciar/cantidad editable/subtotal, y su pie empuja a
     un checkout con envío (F4). El carrito propio vive en app.js. El módulo queda
     intacto en disco por si se retoma. Ver docs/TRASPASO_WEB.md §0.12 -->
<script src="app.js" defer></script>
</head>
<body class="ds">

<div class="page">

  <div class="ds-announce" id="anuncio"></div>

  <nav class="ds-nav" id="top">
    <div class="ds-wrap ds-nav__in">
      <button class="ds-nav__burger" id="burger" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu"><span></span></button>
      <div class="ds-nav__links" id="nav-links"></div>
      <a class="ds-nav__logo" href="index.html" id="nav-logo"></a>
      <div class="ds-nav__end">
        <button class="t-cart-btn" aria-label="Ver carrito"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><span class="t-count" data-n="0"></span></button>
        <a class="ds-btn ds-btn--outline ds-btn--sm" id="nav-cta" href="index.html#contacto"></a>
      </div>
    </div>
  </nav>

  <section>
    <div class="ds-wrap">
      <a class="volver" id="pdp-volver" href="catalogo.html"></a>
      <div class="ds-pdp" id="pdp">

        <div class="ds-pdp__media">
          <div class="ds-gallery">
            <div class="ds-gallery__main" id="pdp-main"></div>
            <div class="ds-gallery__thumbs" id="pdp-thumbs"></div>
          </div>
        </div>

        <div class="ds-pdp__info">
          <div>
            <span class="ds-card__tag pdp-cat" id="pdp-cat"></span>
            <h1 class="ds-pdp__title" id="pdp-titulo"></h1>
          </div>

          <div class="ds-pdp__meta">
            <span class="ds-price ds-price--lg" id="pdp-precio"></span>
            <!-- Precio mayorista: APLAZADO. app.js solo lo pinta si
                 precio_mayor tiene valor; con null no ocupa ni un píxel.
                 Ver docs/TRASPASO_WEB.md §0.5 -->
            <span class="ds-price" id="pdp-precio-mayor" hidden></span>
            <span class="ds-ref" id="pdp-ref"></span>
          </div>

          <div class="ds-pdp__block">
            <p class="ds-pdp__label" id="pdp-label-color"></p>
            <div class="ds-colors" id="pdp-colores" role="group"></div>
          </div>

          <div class="ds-pdp__block">
            <p class="ds-pdp__label" id="pdp-label-talla"></p>
            <div class="ds-sizes" id="pdp-tallas" role="group"></div>
          </div>

          <div class="ds-pdp__block">
            <dl id="pdp-detalles"></dl>
          </div>

          <!-- Dos acciones: agregar al pedido y pedir por WhatsApp.
               Las pinta app.js con la variante de color leída en el clic. -->
          <div class="ds-wa">
            <div class="ds-wa__in">
              <span class="ds-wa__price" id="pdp-wa-precio"></span>
              <div id="pdp-acciones"></div>
            </div>
          </div>
          <div class="ds-wa-pad"></div>
        </div>

      </div>
    </div>
  </section>

  <footer class="ds-footer">
    <div class="ds-wrap">
      <div class="ds-footer__top">
        <span class="ds-footer__logo" id="pie-logo"></span>
        <div class="ds-footer__cols" id="pie-cols"></div>
      </div>
      <div class="ds-footer__bottom"><span id="pie-nombre"></span><span id="pie-legal"></span></div>
    </div>
  </footer>

</div><!-- /.page -->

<div class="ds-menu__backdrop" id="menu-bd"></div>
<aside class="ds-menu" id="menu" aria-label="Menú">
  <div class="ds-menu__head">
    <span class="ds-menu__logo" id="menu-logo"></span>
    <button class="ds-menu__close" id="menu-x" type="button" aria-label="Cerrar menú">&times;</button>
  </div>
  <nav class="ds-menu__links" id="menu-links"></nav>
  <div class="ds-menu__foot"><a class="ds-btn ds-btn--solid ds-btn--block" id="menu-cta" href="index.html#contacto"></a></div>
</aside>

</body>
</html>
