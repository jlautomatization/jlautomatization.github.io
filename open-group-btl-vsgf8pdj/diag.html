<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico de videos</title>
<style>
  body{margin:0;padding:16px;background:#131F27;color:#FAF8F3;font:15px/1.4 -apple-system,Segoe UI,sans-serif}
  h1{font-size:18px;margin:0 0 4px}.sub{color:#9fb0b8;font-size:13px;margin:0 0 14px}
  .v{border:1px solid #2b3b45;padding:10px;margin:0 0 14px}
  .v h2{font-size:15px;margin:0 0 6px}.v video{width:100%;background:#000;display:block}
  .d{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;margin-top:6px;white-space:pre-wrap}
  .ok{color:#B9E200}.mal{color:#ff8a80}
  button{font:inherit;padding:8px 12px;background:#1F2E3A;color:#FAF8F3;border:1px solid #B9E200;margin:0 0 14px}
</style></head><body>
<h1>Diagnóstico de videos (solo para Jose)</h1>
<p class="sub" id="info">…</p>
<button id="copiar">Copiar reporte</button>
<div id="lista"></div>
<script>
(function(){
  var movil = window.innerWidth <= 820;
  var base = 'videos/';
  var VIDEOS = [
    ['Pitch (4 min)', 'pitch/propuesta-en-video', 'pitch/propuesta-en-video.jpg'],
    ['Corto 1 · Salida', 'entienda/01-salida-de-la-bodega', 'entienda/01-salida-de-la-bodega.jpg'],
    ['Corto 2 · Llegada y regreso', 'entienda/02-llegada-y-regreso', 'entienda/02-llegada-y-regreso.jpg'],
    ['Corto 3 · Panel del dueño', 'entienda/03-panel-del-dueno', 'entienda/03-panel-del-dueno.jpg'],
    ['Recorrida (7 min)', 'plan3/plan3-completo', '../portada/video-completo-poster.jpg']
  ];
  var c = navigator.connection || {};
  document.getElementById('info').textContent = (movil ? 'celular (720p)' : 'escritorio (completa)') + ' · ancho ' + window.innerWidth +
    ' · red: ' + (c.effectiveType || '?') + (c.downlink ? ' ' + c.downlink + ' Mbps' : '') + (c.rtt ? ' rtt ' + c.rtt + ' ms' : '') +
    ' · ' + navigator.userAgent.replace(/^.*\((.*?)\).*$/, '$1');
  var t0 = performance.now(), filas = [];
  function bytesDe(url){
    var n = 0, k = 0;
    performance.getEntriesByType('resource').forEach(function(e){ if(e.name.indexOf(url) >= 0){ k++; n += (e.transferSize || e.encodedBodySize || 0); } });
    return { peticiones: k, kb: Math.round(n / 1024) };
  }
  VIDEOS.forEach(function(def, i){
    var titulo = def[0], src = base + def[1] + (movil ? '-720' : '') + '.mp4', poster = def[2].indexOf('../') === 0 ? def[2].slice(3) : base + def[2];
    var box = document.createElement('div'); box.className = 'v';
    box.innerHTML = '<h2>' + (i + 1) + '. ' + titulo + '</h2>';
    var v = document.createElement('video'); v.controls = true; v.preload = 'metadata'; v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
    v.poster = poster; v.src = src;
    var d = document.createElement('div'); d.className = 'd'; d.textContent = 'archivo: ' + src + '\nesperando…';
    box.appendChild(v); box.appendChild(d); document.getElementById('lista').appendChild(box);
    var st = { titulo: titulo, meta: null, tap: null, arranque: null, espera: 0, errores: 0 };
    function pintar(){
      var b = bytesDe(src);
      d.innerHTML = 'archivo: ' + src +
        '\níndice listo: ' + (st.meta == null ? '…' : (st.meta / 1000).toFixed(1) + ' s tras abrir la página') +
        '\ntoque play → arranca: ' + (st.arranque == null ? (st.tap == null ? '(toca play)' : 'cargando… ' + ((performance.now() - st.tap) / 1000).toFixed(1) + ' s') :
          '<b class="' + (st.arranque < 1500 ? 'ok' : 'mal') + '">' + (st.arranque / 1000).toFixed(2) + ' s</b>') +
        '\npeticiones: ' + b.peticiones + ' · descargado: ' + b.kb + ' KB · esperas: ' + st.espera + ' · errores: ' + st.errores +
        '\nreadyState: ' + v.readyState + ' · buffered: ' + (v.buffered.length ? v.buffered.end(0).toFixed(1) + ' s' : '0');
    }
    v.addEventListener('loadedmetadata', function(){ st.meta = performance.now() - t0; pintar(); });
    v.addEventListener('play', function(){ if(st.tap == null){ st.tap = performance.now(); } pintar(); });
    v.addEventListener('playing', function(){ if(st.arranque == null && st.tap != null) st.arranque = performance.now() - st.tap; pintar(); });
    v.addEventListener('waiting', function(){ st.espera++; pintar(); });
    v.addEventListener('error', function(){ st.errores++; pintar(); });
    v.addEventListener('timeupdate', pintar);
    setInterval(pintar, 1000);
    filas.push(function(){ return (i + 1) + '. ' + titulo + ' | indice ' + (st.meta == null ? '-' : (st.meta / 1000).toFixed(1) + 's') + ' | arranque ' + (st.arranque == null ? '-' : (st.arranque / 1000).toFixed(2) + 's') + ' | ' + JSON.stringify(bytesDe(src)) + ' | esperas ' + st.espera; });
  });
  document.getElementById('copiar').onclick = function(){
    var txt = document.getElementById('info').textContent + '\n' + filas.map(function(f){ return f(); }).join('\n');
    if(navigator.clipboard) navigator.clipboard.writeText(txt);
    alert(txt);
  };
})();
</script>
</body></html>
