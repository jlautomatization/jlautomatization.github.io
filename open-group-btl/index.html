<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Propuesta · Open Group BTL</title>
<link rel="canonical" href="https://jlautomatization.github.io/open-group-btl-v4/">
<meta http-equiv="refresh" content="0; url=https://jlautomatization.github.io/open-group-btl-v4/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23393E90'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;1,400&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--papel:#FAF8F3;--tinta:#131F27;--gris:#6B7580;--indigo:#393E90;--linea:#DAD5CA}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--papel);color:var(--tinta);font-family:"Public Sans",system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.55}
  .caja{max-width:38rem;width:100%}
  .marca{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--indigo);
         font-weight:600;margin-bottom:16px}
  h1{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:clamp(26px,5vw,40px);
     line-height:1.12;letter-spacing:-.015em;margin-bottom:14px}
  h1 em{font-style:italic}
  p{color:var(--gris);max-width:46ch;margin-bottom:10px}
  .regla{width:40px;height:2px;background:var(--indigo);margin:22px 0}
  a.ir{display:inline-block;background:var(--tinta);color:var(--papel);text-decoration:none;
       padding:13px 22px;font-weight:600;font-size:15px}
  a.ir:hover{background:var(--indigo)}
  .nota{margin-top:26px;padding-top:16px;border-top:1px solid var(--linea);font-size:13px;color:var(--gris)}
</style>
</head>
<body>
  <div class="caja">
    <div class="marca">Open Group BTL</div>
    <h1>Esta propuesta<br><em>se actualizó.</em></h1>
    <p>Hay una versión nueva, con los precios y el alcance al día. Lo estamos llevando allá.</p>
    <div class="regla"></div>
    <a class="ir" href="https://jlautomatization.github.io/open-group-btl-v4/">Ver la propuesta al día</a>
    <div class="nota">Si no pasa solo en un momento, toque el botón. La clave de acceso es la misma.</div>
  </div>
<script>location.replace("https://jlautomatization.github.io/open-group-btl-v4/");</script>
</body>
</html>
