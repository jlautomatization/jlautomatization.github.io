<style>
  :root{--bg:#000;--card:#0C0D10;--line:rgba(255,255,255,.07);--text:#F5F6F8;--mut:#8C93A0;--azul:#1F4E79;--azul-luz:#4A93D6;--oro:#C9992B}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
  .caja{width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 24px;text-align:center}
  .marca{font-weight:800;letter-spacing:-.04em;font-size:1.1rem;margin-bottom:16px}
  .marca b{color:var(--oro)}
  p{color:var(--mut);line-height:1.55;margin-bottom:24px}
  a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;background:var(--azul);color:#fff;font-weight:600;text-decoration:none}
  a.btn:hover{background:var(--azul-luz)}
  a.btn:focus-visible{outline:2px solid var(--azul-luz);outline-offset:3px}
</style>
</head>
<body>
  <main class="caja">
    <div class="marca">JL<b>A</b></div>
    <p>El catálogo ahora está en la sección Sectores.</p>
    <a class="btn" href="../sectores.html">Ir a Sectores</a>
  </main>
</body>
</html>
